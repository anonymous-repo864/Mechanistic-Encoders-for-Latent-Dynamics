# Base config for GRU (ode_rnn).
# Override study/exp_name/out_root/scaffold/dataset_path per run via --set.

study: LSTM_bias_check
exp_name: GRU
out_root: experiments

epochs: 100
batch_size: 32
lr: 0.001
weight_decay: 0.0085
val_n: 1
test_n: 1
seed: 42

hidden: 256
lift_dim: 32
num_layers: 2
dropout: 0.0
grad_clip: 1.0

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 500

scaffold: glycolysis_oracle22
dataset_path: datasets/glycolysis/glycolysis_oracle22_n1000.npz
theta_lo: 1.0e-3
theta_hi: 100.0
n_substeps: 1

ckpt_every: 10
jit_scripting: true
model_class: ode_rnn
