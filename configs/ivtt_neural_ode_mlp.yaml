# Black-box ablation: pure neural ODE — MLP IS the vector field.
# No mechanistic scaffold informs the dynamics; the scaffold name is set only
# so the dataset wiring (P=7, control_indices, jump matrix) is consistent.

dataset_path: datasets/real_ivtt_exact_full.npz
study: ivtt_neural_ode_mlp
tags: null
exp_name: default
out_root: experiments

save_model_name: model.pt
save_last_name: model_last.pt
save_curves_name: loss_curves.npz

epochs: 250
batch_size: 100
lr: 0.002
weight_decay: 0.0018
warmup_epochs: 0
cosine_decay: false

val_n: 0
test_n: 0
val_frac: 0.0
seed: 42
split_seed: 42

use_fixed_split: true
fixed_split_seed: 57
fixed_test_frac: 0.125
fixed_val_frac: 0.125

fixed_split_idx: 0

stratified_split: false
stratify_bins: 5
stratify_targets: null

num_workers: 0
pin_memory: true

# === Model: pure MLP vector field, no scaffold in the dynamics ===
model_class: neural_ode_mlp
scaffold: ivtt_analytic   # ignored by NeuralODE — used only for shape info

hidden: 400
lift_dim: 32
num_layers: 2
dropout: 0.2
n_substeps: 1

# Same input feature pipeline as the encoder configs (sqrt on u, sqrt_clamp1 on y),
# so the MLP vector field sees compressed features instead of raw 1e3-scale state.
u_transform: sqrt
y_transform: sqrt_clamp1

# Plain MSE on observed channels. Black-box theta is dimensionless,
# so use_ivtt_mse_loss does not apply.
obs_normalization: null
use_ivtt_mse_loss: false
obs_idx: [3, 5]

teacher_forcing: false
grad_clip: 1.0

jit_scripting: false
endpoint_r2: true
