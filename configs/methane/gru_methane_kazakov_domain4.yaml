# GRU (ode_rnn) on domain-informed 4-step methane scaffold (Kazakov data)

study: methane_domain4_fit
exp_name: GRU_7state_Kazakov_domain4
out_root: experiments

epochs: 30
batch_size: 32
lr: 0.001
weight_decay: 0.0085
val_n: 100
test_n: 100
seed: 42

hidden: 256
lift_dim: 32
num_layers: 2
dropout: 0.0
grad_clip: 1.0

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 500

scaffold: methane_domaininformed4_no
dataset_path: datasets/kazakov_obs7.npz
obs_idx: [0, 1, 2, 3, 4, 5, 6]
theta_lo: 1.0e-5
theta_hi: 10.0
n_substeps: 1

ckpt_every: 10
jit_scripting: true
model_class: ode_rnn
