# Base config for Mamba (ode_mamba).
# Override study/exp_name/out_root/scaffold/dataset_path per run via --set.

study: mamba_test
exp_name: mamba_test1
out_root: experiments

epochs: 100
batch_size: 64
lr: 0.001
weight_decay: 0.0085
val_n: 100
test_n: 100
seed: 42

hidden: 128
lift_dim: 32
num_layers: 2
dropout: 0.1
grad_clip: 1.0

# Mamba-specific
d_state: 16
expand: 2
d_conv: 4

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 500

scaffold: mof_synthesis_4
dataset_path: datasets/mof_synthesis_4.npz
theta_lo: 1.0e-3
theta_hi: 2.0
n_substeps: 1

ckpt_every: 10
jit_scripting: false
model_class: ode_mamba_ssm
