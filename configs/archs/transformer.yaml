# Base config for Transformer (ode_transformer).
# Override study/exp_name/out_root/scaffold/dataset_path per run via --set.

study: transformer_test
exp_name: transformer_test
out_root: experiments

epochs: 200
batch_size: 32
lr: 0.001
weight_decay: 0.0085
warmup_epochs: 10
val_n: 100
test_n: 100
seed: 42

hidden: 128
lift_dim: 32
num_layers: 2
ff_mult: 4
context_len: 128
grad_clip: 1.0

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 500

scaffold: mof_synthesis_4
dataset_path: datasets/mof_synthesis_4.npz
theta_lo: 1.0e-3
theta_hi: 2.0
n_substeps: 1

ckpt_every: 10
jit_scripting: false
torch_compile: false
autocast_bf16: true
model_class: ode_transformer
