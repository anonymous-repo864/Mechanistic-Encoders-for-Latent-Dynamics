
dataset_path: datasets/real_ivtt_exact_full_drop5000.npz
study: ivtt_gru_drop5000
tags: null
exp_name: default
out_root: experiments

save_model_name: model.pt
save_last_name: model_last.pt
save_curves_name: loss_curves.npz

epochs: 250
batch_size: 100
lr: 0.002
weight_decay: 0.0018
warmup_epochs: 0
cosine_decay: false

# Train/val/test split
val_n: 0
test_n: 0
val_frac: 0.0
seed: 42
split_seed: 42

use_fixed_split: true
fixed_split_seed: 57
fixed_test_frac: 0.125
fixed_val_frac: 0.125
fixed_split_file: "bob_model/3 seed splits.py"
fixed_split_idx: 0

stratified_split: false
stratify_bins: 5
stratify_targets: null

num_workers: 0
pin_memory: true

model_class: ode_rnn
scaffold: ivtt_analytic

hidden: 400
lift_dim: 32          # ignored when lift_skip=true
num_layers: 2
dropout: 0.2
gru_init: supervisor            # orthogonal_(W_hh) + xavier_(W_ih) + zeros(biases)
head_init: supervisor           # xavier_(weight) + zeros(bias)

# Theta head: per-parameter bounds come from IvttAnalyticScaffold.theta_lo_vec/_hi_vec.
# theta_lo/theta_hi below are unused (scalar fallback) but must be present.
theta_lo: 1.0e-06
theta_hi: 2.0
theta_bounded: true
n_substeps: 1                    # unused under analytic step

gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]   # all 12 control cols except DNA c (idx 2)
gru_y_cols: [3, 5]                                 # only mm (idx 3) and pm (idx 5) feed the encoder
u_transform: sqrt
y_transform: sqrt_clamp1                           # sqrt then clamp_min(1)

# Loss: plain MSE on (mm, pm) in raw scale, no normalization, no aux terms.
# Works for any model that emits the 8-d theta layout, which IvttAnalyticScaffold
# does via emit_theta.
obs_normalization: null
use_ivtt_mse_loss: true
obs_idx: [3, 5]    # diagnostic slicing for printed test metrics; doesn't change training loss

teacher_forcing: true
tf_every: 200
tf_drop_epoch: 100
grad_clip: 1.0

# JIT scripting off — OdeRNN with the analytic-scaffold branch isn't script-traced;
# the cost is small (~10% step time) and parity is the priority.
jit_scripting: true
endpoint_r2: true
